name: lean

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        env:
          # leanchecker loads a full Mathlib environment per module; one thread keeps the
          # GitHub runner within memory (see the lean-action README).
          LEAN_NUM_THREADS: "1"
        with:
          use-mathlib-cache: true
          test: false
          lint: false
          # Independent replay of every declaration of the Collatz modules through the
          # kernel (leanchecker), in addition to the lake build.
          leanchecker: true
          leanchecker-args: "Collatz"
      - name: No sorry, native_decide or axiom in the sources
        run: |
          set -euo pipefail
          if grep -rnE '(^|[^`])\bsorry\b|(^|[^`])native_decide|^\s*axiom\b' Collatz Collatz.lean; then
            echo "forbidden construct found" >&2
            exit 1
          fi
      - name: Axiom audit (every Collatz declaration)
        run: lake env lean scripts/AxiomAudit.lean
      - name: Main statement
        run: lake env lean scripts/Statement.lean
